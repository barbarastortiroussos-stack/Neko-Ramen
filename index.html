<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izakaya no Entardecer</title>
<style>
  :root{
    --wood-dark:#2b1a10;
    --wood:#4a2f1c;
    --wood-light:#7a4c26;
    --gold:#e8b64a;
    --gold-dark:#a97a1f;
    --paper:#f3e6c9;
    --shadow:rgba(0,0,0,.55);
    --green:#6fae5c;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:linear-gradient(160deg, #3a2415, #1f130b);
    font-family:'Segoe UI', 'Hiragino Sans', sans-serif;
    overflow:hidden;
    user-select:none;
  }

  #game{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      url('background.png') center center / cover no-repeat,
      linear-gradient(160deg, #3a2415, #1f130b);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }

  #game::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- HUD SUPERIOR ---------- */
  #hud-top{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:16px 20px;
    z-index:20;
    pointer-events:none;
  }

  .hud-left, .hud-right{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }

  .hud-pill{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:2px solid var(--gold-dark);
    border-radius:999px;
    padding:8px 16px;
    color:var(--paper);
    font-weight:700;
    font-size:18px;
    box-shadow:0 4px 10px var(--shadow), inset 0 1px 0 rgba(255,255,255,.15);
  }

  .coin-icon{
    width:24px;height:24px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff4c9, var(--gold) 55%, var(--gold-dark) 100%);
    border:2px solid #7a5613;
    display:inline-block;
    box-shadow:0 0 6px rgba(232,182,74,.7);
  }

  .icon-btn{
    pointer-events:auto;
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:2px solid var(--gold-dark);
    color:var(--paper);
    width:46px;height:46px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 4px 10px var(--shadow);
    transition:transform .1s;
  }
  .icon-btn:active{ transform:scale(.92); }

  /* ---------- BARRA DE EXPEDIENTE ---------- */
  #shift-bar-wrap{
    position:absolute;
    top:64px;
    left:50%;
    transform:translateX(-50%);
    width:min(480px, 70vw);
    z-index:20;
    text-align:center;
    pointer-events:none;
  }

  #shift-label{
    color:var(--paper);
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
    text-shadow:0 2px 4px #000;
    margin-bottom:4px;
  }

  #shift-track{
    height:14px;
    border-radius:999px;
    background:rgba(0,0,0,.5);
    border:1px solid var(--gold-dark);
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }

  #shift-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg, #ffd479, var(--gold) 60%, var(--gold-dark));
    transition:width .2s linear;
  }

  /* ---------- MESAS / CLIENTES ---------- */
  #tables-layer{
    position:absolute;
    inset:0;
    z-index:10;
  }

  .table-spot{
    position:absolute;
    width:9%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    cursor:pointer;
  }

  .table-spot.t1{ left:28%; top:53%; }
  .table-spot.t2{ left:50%; top:51%; }
  .table-spot.t3{ left:73%; top:53%; }

  .customer{
    width:100%;
    height:100%;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold) 60%, var(--gold-dark));
    border:3px solid #fff8e5;
    box-shadow:0 0 18px rgba(255,220,150,.85), 0 6px 12px var(--shadow);
    animation:pop .25s ease-out;
    overflow:visible;
    transition:box-shadow .2s;
  }
  .customer.show{ display:flex; }

  /* destaque quando o prato na mão do jogador combina com o pedido dessa mesa */
  .customer.match-highlight{
    box-shadow:0 0 0 6px rgba(111,174,92,.55), 0 0 18px rgba(255,220,150,.85), 0 6px 12px var(--shadow);
  }

  .customer-sprite{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:top center;
    pointer-events:none;
  }

  .customer-fallback-emoji{
    display:none;
    font-size:2em;
    pointer-events:none;
  }
  .customer.sprite-failed .customer-sprite{ display:none; }
  .customer.sprite-failed .customer-fallback-emoji{ display:block; }

  .order-bubble{
    position:absolute;
    top:-14px;
    right:-10px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--gold-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1em;
    box-shadow:0 3px 6px var(--shadow);
    pointer-events:none;
  }

  @keyframes pop{
    from{ transform:scale(.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .patience-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.35);
    pointer-events:none;
  }

  .coin-pop{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold);
    font-weight:800;
    font-size:16px;
    text-shadow:0 2px 4px #000;
    pointer-events:none;
    animation:rise .8s ease-out forwards;
  }
  .coin-pop.miss{ color:#e2e2e2; }
  @keyframes rise{
    to{ transform:translate(-50%,-40px); opacity:0; }
  }

  /* ---------- COZINHA ---------- */
  #kitchen-bar{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:25;
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    border:2px solid var(--gold-dark);
    border-radius:18px;
    padding:10px 14px;
    box-shadow:0 6px 18px var(--shadow);
  }

  #carrying-slot{
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px dashed var(--gold-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6em;
    background:rgba(0,0,0,.25);
    flex-shrink:0;
  }
  #carrying-slot.filled{
    border-style:solid;
    background:radial-gradient(circle at 35% 30%, #fff4c9, var(--gold) 60%, var(--gold-dark));
    animation:pop .2s ease-out;
  }

  #kitchen-divider{
    width:2px;
    align-self:stretch;
    background:rgba(255,255,255,.15);
    margin:2px 0;
  }

  #recipe-tray{
    display:flex;
    gap:8px;
  }

  .recipe-btn{
    position:relative;
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px solid var(--gold-dark);
    background:linear-gradient(180deg, #fff4c9, var(--gold));
    font-size:1.5em;
    cursor:pointer;
    overflow:hidden;
    box-shadow:0 3px 8px var(--shadow);
  }
  .recipe-btn:active{ transform:scale(.94); }
  .recipe-btn:disabled{ cursor:not-allowed; opacity:.85; }

  .recipe-btn .cook-fill{
    position:absolute;
    left:0; right:0; bottom:0;
    height:0%;
    background:rgba(43,26,16,.55);
    transition:height linear;
    pointer-events:none;
  }

  /* ---------- OVERLAYS (pause / fim de dia / loja) ---------- */
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(10,6,3,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }

  .panel{
    background:linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    border:3px solid var(--gold-dark);
    border-radius:16px;
    padding:32px 36px;
    text-align:center;
    color:var(--paper);
    min-width:280px;
    box-shadow:0 10px 30px var(--shadow);
  }

  .panel h2{
    margin:0 0 12px;
    color:var(--gold);
    font-size:24px;
    letter-spacing:.5px;
  }

  .panel p{
    margin:6px 0;
    font-size:16px;
  }

  .panel .big-coin{
    font-size:22px;
    color:var(--gold);
    font-weight:800;
    margin:14px 0;
  }

  .game-btn{
    margin-top:16px;
    background:linear-gradient(180deg, var(--gold), var(--gold-dark));
    border:none;
    color:#2b1a10;
    font-weight:800;
    font-size:16px;
    padding:12px 28px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 10px var(--shadow);
  }
  .game-btn:active{ transform:translateY(1px); }

  /* ---------- LOJA ---------- */
  #shop-panel{
    position:relative;
    background:linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    border:3px solid var(--gold-dark);
    border-radius:16px;
    padding:24px 26px;
    color:var(--paper);
    width:min(420px, 90vw);
    max-height:80vh;
    overflow-y:auto;
    box-shadow:0 10px 30px var(--shadow);
  }
  #shop-close-x{
    position:absolute;
    top:10px;
    right:10px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid var(--gold-dark);
    background:rgba(0,0,0,.35);
    color:var(--paper);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #shop-close-x:active{ transform:scale(.92); }
  #shop-panel h2{
    margin:0 0 4px;
    color:var(--gold);
    text-align:center;
  }
  #shop-panel .shop-sub{
    text-align:center;
    font-size:13px;
    opacity:.85;
    margin-bottom:16px;
  }

  .shop-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(0,0,0,.25);
    border:1px solid var(--gold-dark);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .shop-item .shop-icon{
    width:42px;height:42px;
    border-radius:10px;
    background:linear-gradient(180deg, #fff4c9, var(--gold));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4em;
    flex-shrink:0;
  }
  .shop-item .shop-info{
    flex:1;
    text-align:left;
  }
  .shop-item .shop-info .shop-name{
    font-weight:700;
    font-size:15px;
  }
  .shop-item .shop-info .shop-desc{
    font-size:12px;
    opacity:.8;
  }
  .shop-buy-btn{
    background:linear-gradient(180deg, var(--gold), var(--gold-dark));
    border:none;
    color:#2b1a10;
    font-weight:800;
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
  }
  .shop-buy-btn:disabled{
    background:#555;
    color:#aaa;
    cursor:not-allowed;
  }

  #shop-close-btn{
    display:block;
    margin:14px auto 0;
  }

  .toast{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,12,6,.85);
    border:1px solid var(--gold-dark);
    color:var(--paper);
    padding:8px 18px;
    border-radius:999px;
    font-size:14px;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  /* ---------- PAINEL DE DIAGNÓSTICO ---------- */
  #debug-panel{
    position:fixed;
    left:10px;
    bottom:10px;
    max-width:min(92vw, 480px);
    max-height:40vh;
    overflow:auto;
    background:rgba(20,4,4,.92);
    border:2px solid #ff6b6b;
    color:#ffe2e2;
    font:12px/1.5 monospace;
    padding:10px 12px;
    border-radius:8px;
    z-index:9999;
    display:none;
    white-space:pre-wrap;
  }
  #debug-panel.show{ display:block; }
  #debug-panel strong{ color:#ff9d9d; }
</style>
</head>
<body>

<div id="game">

  <!-- HUD -->
  <div id="hud-top">
    <div class="hud-left">
      <div class="hud-pill">
        <span class="coin-icon"></span>
        <span id="coin-count">0</span>
      </div>
      <button class="icon-btn" id="shop-btn" title="Loja">🏮</button>
    </div>
    <button class="icon-btn" id="pause-btn" title="Pausar">⏸</button>
  </div>

  <div id="shift-bar-wrap">
    <div id="shift-label">DIA <span id="day-count">1</span> — EXPEDIENTE</div>
    <div id="shift-track"><div id="shift-fill"></div></div>
  </div>

  <!-- clientes sobre as mesas -->
  <div id="tables-layer">
    <div class="table-spot t1"><div class="customer" id="c1">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
    <div class="table-spot t2"><div class="customer" id="c2">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
    <div class="table-spot t3"><div class="customer" id="c3">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- cozinha: prepara o prato e depois entrega na mesa -->
  <div id="kitchen-bar">
    <div id="carrying-slot" title="Prato na mão">—</div>
    <div id="kitchen-divider"></div>
    <div id="recipe-tray"></div>
  </div>

  <!-- overlay de pause -->
  <div class="overlay" id="pause-overlay">
    <div class="panel">
      <h2>Jogo Pausado</h2>
      <p>Respire um pouco antes de voltar ao balcão.</p>
      <button class="game-btn" id="resume-btn">Continuar</button>
    </div>
  </div>

  <!-- overlay fim de expediente -->
  <div class="overlay" id="endday-overlay">
    <div class="panel">
      <h2>Fim do Expediente</h2>
      <p id="endday-summary">Você atendeu os clientes do Dia 1.</p>
      <div class="big-coin">+<span id="endday-coins">0</span> moedas hoje</div>
      <button class="game-btn" id="nextday-btn">Começar Dia 2</button>
    </div>
  </div>

  <!-- overlay da loja -->
  <div class="overlay" id="shop-overlay">
    <div id="shop-panel">
      <button id="shop-close-x" title="Fechar">✕</button>
      <h2>Lojinha do Izakaya</h2>
      <div class="shop-sub">Compre novas receitas e melhorias com suas moedas</div>
      <div id="shop-list"></div>
      <button class="game-btn" id="shop-close-btn">Fechar</button>
    </div>
  </div>

</div>

<div id="debug-panel"></div>

<script>
/* =========================================================================
   PAINEL DE DIAGNÓSTICO
   ========================================================================= */
const DebugPanel = (function(){
  const panel = document.getElementById('debug-panel');
  const lines = [];
  function render(){
    panel.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
    panel.classList.add('show');
  }
  return { log(msg){ lines.push(msg); render(); } };
})();

window.addEventListener('error', function(e){
  DebugPanel.log(`<strong>Erro de JS:</strong> ${e.message} (linha ${e.lineno})`);
});

/* =========================================================================
   ASSETS
   ========================================================================= */
const ASSETS = {
  background: 'background.png',
  customerSprites: [
    'customer_cat.png',
    'customer_panda.png',
  ],
};

function checkImage(path){
  const img = new Image();
  img.onerror = () => DebugPanel.log(
    `<strong>Imagem não encontrada:</strong> "${path}" — confira maiúsculas/minúsculas, ` +
    `espaços no nome e se o arquivo está mesmo nessa pasta no repositório.`
  );
  img.src = path;
}
checkImage(ASSETS.background);
ASSETS.customerSprites.forEach(checkImage);

/* =========================================================================
   RECEITAS E LOJA
   - "unlocked: true" = já disponível na cozinha desde o início
   - "reward": intervalo de moedas ganho ao entregar corretamente
   - "cookTime": segundos para preparar
   ========================================================================= */
const RECIPES = [
  { id:'sake',     name:'Sakê',     emoji:'🍶', price:0,   cookTime:0.6, reward:[5,9],   unlocked:true  },
  { id:'ramen',    name:'Ramen',    emoji:'🍜', price:0,   cookTime:1.0, reward:[8,13],  unlocked:true  },
  { id:'onigiri',  name:'Onigiri',  emoji:'🍙', price:30,  cookTime:0.8, reward:[10,16], unlocked:false },
  { id:'sushi',    name:'Sushi',    emoji:'🍣', price:60,  cookTime:1.4, reward:[14,22], unlocked:false },
  { id:'dango',    name:'Dango',    emoji:'🍡', price:90,  cookTime:1.1, reward:[17,26], unlocked:false },
  { id:'yakitori', name:'Yakitori', emoji:'🍢', price:130, cookTime:1.6, reward:[22,34], unlocked:false },
];

const UPGRADES = [
  { id:'patience1', name:'Sino da Paciência', emoji:'🔔', price:50,
    desc:'+3s de paciência dos clientes', unlocked:false,
    apply(state){ state.patienceTime += 3; } },
  { id:'spawn1', name:'Fama do Izakaya', emoji:'🎏', price:80,
    desc:'Clientes chegam com mais frequência', unlocked:false,
    apply(state){ state.spawnInterval = Math.max(0.7, state.spawnInterval - 0.5); } },
];

function recipeById(id){ return RECIPES.find(r => r.id === id); }

/* =========================================================================
   JOGO
   ========================================================================= */
(function(){
  try{

  // ---------------- ESTADO ----------------
  const state = {
    coins: 0,
    day: 1,
    shiftDuration: 60,
    shiftTimeLeft: 60,
    paused: false,
    shopOpen: false,
    shiftRunning: true,
    coinsToday: 0,
    spawnTimer: 0,
    spawnInterval: 1.8,
    patienceTime: 6,
    carrying: null,   // id da receita que o jogador está segurando pronta
    cooking: false,   // true enquanto uma receita está sendo preparada
  };

  const tables = ['c1','c2','c3'].map(id => {
    const el = document.getElementById(id);
    return {
      el,
      img: el.querySelector('.customer-sprite'),
      bubble: el.querySelector('.order-bubble'),
      occupied: false,
      patience: 0,
      orderId: null,
    };
  });

  const coinCountEl = document.getElementById('coin-count');
  const dayCountEl = document.getElementById('day-count');
  const shiftFillEl = document.getElementById('shift-fill');
  const pauseBtn = document.getElementById('pause-btn');
  const pauseOverlay = document.getElementById('pause-overlay');
  const resumeBtn = document.getElementById('resume-btn');
  const enddayOverlay = document.getElementById('endday-overlay');
  const enddaySummary = document.getElementById('endday-summary');
  const enddayCoins = document.getElementById('endday-coins');
  const nextdayBtn = document.getElementById('nextday-btn');
  const toastEl = document.getElementById('toast');
  const carryingSlot = document.getElementById('carrying-slot');
  const recipeTray = document.getElementById('recipe-tray');
  const shopBtn = document.getElementById('shop-btn');
  const shopOverlay = document.getElementById('shop-overlay');
  const shopList = document.getElementById('shop-list');
  const shopCloseBtn = document.getElementById('shop-close-btn');

  // ---------------- UI HELPERS ----------------
  function updateCoinsUI(){
    coinCountEl.textContent = state.coins;
  }

  function updateShiftUI(){
    const pct = Math.max(0, (state.shiftTimeLeft / state.shiftDuration) * 100);
    shiftFillEl.style.width = pct + '%';
    dayCountEl.textContent = state.day;
  }

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1300);
  }

  function spawnCoinPop(tableEl, amount, isMiss){
    const pop = document.createElement('div');
    pop.className = 'coin-pop' + (isMiss ? ' miss' : '');
    pop.textContent = '+' + amount;
    tableEl.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }

  function refreshTableHighlights(){
    tables.forEach(t => {
      const isMatch = state.carrying && t.occupied && t.orderId === state.carrying;
      t.el.classList.toggle('match-highlight', !!isMatch);
    });
  }

  // ---------------- COZINHA (preparar pratos) ----------------
  function unlockedRecipes(){ return RECIPES.filter(r => r.unlocked); }

  function renderRecipeTray(){
    recipeTray.innerHTML = '';
    unlockedRecipes().forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'recipe-btn';
      btn.title = r.name;
      btn.innerHTML = `${r.emoji}<div class="cook-fill"></div>`;
      btn.addEventListener('click', () => startCooking(r.id));
      recipeTray.appendChild(btn);
    });
  }

  function updateCarryingUI(){
    if (state.carrying){
      const r = recipeById(state.carrying);
      carryingSlot.textContent = r ? r.emoji : '?';
      carryingSlot.classList.add('filled');
    } else {
      carryingSlot.textContent = '—';
      carryingSlot.classList.remove('filled');
    }
    refreshTableHighlights();
  }

  function startCooking(recipeId){
    if (state.cooking){
      showToast('Espere o prato atual ficar pronto!');
      return;
    }
    if (state.carrying){
      showToast('Entregue o prato que já está pronto antes de cozinhar outro.');
      return;
    }
    const recipe = recipeById(recipeId);
    if (!recipe) return;

    state.cooking = true;
    const btn = [...recipeTray.children][unlockedRecipes().findIndex(r => r.id === recipeId)];
    const fill = btn ? btn.querySelector('.cook-fill') : null;
    if (btn) btn.disabled = true;

    const start = performance.now();
    const durationMs = recipe.cookTime * 1000;

    function animate(now){
      const elapsed = now - start;
      const pct = Math.min(100, (elapsed / durationMs) * 100);
      if (fill) fill.style.height = pct + '%';
      if (elapsed < durationMs){
        requestAnimationFrame(animate);
      } else {
        state.cooking = false;
        state.carrying = recipe.id;
        if (btn) btn.disabled = false;
        if (fill) fill.style.height = '0%';
        updateCarryingUI();
      }
    }
    requestAnimationFrame(animate);
  }

  // ---------------- CLIENTES ----------------
  function trySpawnCustomer(){
    const free = tables.filter(t => !t.occupied);
    if (free.length === 0) return;
    if (Math.random() > 0.6) return;

    const pool = unlockedRecipes();
    if (pool.length === 0) return;

    const t = free[Math.floor(Math.random() * free.length)];
    const recipe = pool[Math.floor(Math.random() * pool.length)];

    t.occupied = true;
    t.patience = state.patienceTime;
    t.orderId = recipe.id;
    t.bubble.textContent = recipe.emoji;

    const sprite = ASSETS.customerSprites[Math.floor(Math.random() * ASSETS.customerSprites.length)];
    t.img.src = sprite;
    t.el.classList.remove('sprite-failed');
    t.el.classList.add('show');

    refreshTableHighlights();
  }

  function deliverTo(t){
    if (!t.occupied){
      if (state.carrying) showToast('Não tem ninguém nessa mesa.');
      return;
    }
    if (!state.carrying){
      showToast('Prepare um prato na cozinha antes de atender!');
      return;
    }

    const correct = t.orderId === state.carrying;
    const recipe = recipeById(t.orderId);
    let reward;
    if (correct){
      const [min, max] = recipe.reward;
      reward = min + Math.floor(Math.random() * (max - min + 1));
    } else {
      reward = 1 + Math.floor(Math.random() * 2); // gorjeta mínima por engano
      showToast('Isso não era o que esse cliente pediu... ele aceitou por educação.');
    }

    state.coins += reward;
    state.coinsToday += reward;
    updateCoinsUI();
    spawnCoinPop(t.el, reward, !correct);

    t.occupied = false;
    t.orderId = null;
    t.el.classList.remove('show', 'match-highlight');

    state.carrying = null;
    updateCarryingUI();
  }

  function customerLeaves(t){
    t.occupied = false;
    t.orderId = null;
    t.el.classList.remove('show', 'match-highlight');
    showToast('Um cliente foi embora sem ser atendido...');
  }

  tables.forEach(t => {
    t.el.addEventListener('click', () => deliverTo(t));
    t.img.addEventListener('error', () => t.el.classList.add('sprite-failed'));
  });

  // ---------------- LOJA ----------------
  function renderShop(){
    shopList.innerHTML = '';

    RECIPES.filter(r => r.price > 0).forEach(r => {
      const row = document.createElement('div');
      row.className = 'shop-item';
      row.innerHTML = `
        <div class="shop-icon">${r.emoji}</div>
        <div class="shop-info">
          <div class="shop-name">${r.name}</div>
          <div class="shop-desc">Nova receita para o cardápio</div>
        </div>
        <button class="shop-buy-btn">${r.unlocked ? 'Comprado ✓' : r.price + ' 🪙'}</button>
      `;
      const buyBtn = row.querySelector('.shop-buy-btn');
      buyBtn.disabled = r.unlocked || state.coins < r.price;
      buyBtn.addEventListener('click', () => {
        if (r.unlocked || state.coins < r.price) return;
        state.coins -= r.price;
        r.unlocked = true;
        updateCoinsUI();
        renderRecipeTray();
        renderShop();
        showToast(`${r.name} adicionado ao cardápio!`);
      });
      shopList.appendChild(row);
    });

    UPGRADES.forEach(u => {
      const row = document.createElement('div');
      row.className = 'shop-item';
      row.innerHTML = `
        <div class="shop-icon">${u.emoji}</div>
        <div class="shop-info">
          <div class="shop-name">${u.name}</div>
          <div class="shop-desc">${u.desc}</div>
        </div>
        <button class="shop-buy-btn">${u.unlocked ? 'Comprado ✓' : u.price + ' 🪙'}</button>
      `;
      const buyBtn = row.querySelector('.shop-buy-btn');
      buyBtn.disabled = u.unlocked || state.coins < u.price;
      buyBtn.addEventListener('click', () => {
        if (u.unlocked || state.coins < u.price) return;
        state.coins -= u.price;
        u.unlocked = true;
        u.apply(state);
        updateCoinsUI();
        renderShop();
        showToast(`${u.name} aplicado!`);
      });
      shopList.appendChild(row);
    });
  }

  function openShop(){
    state.shopOpen = true;
    renderShop();
    shopOverlay.classList.add('show');
  }
  function closeShop(){
    state.shopOpen = false;
    shopOverlay.classList.remove('show');
  }

  shopBtn.addEventListener('click', openShop);
  shopCloseBtn.addEventListener('click', closeShop);
  document.getElementById('shop-close-x').addEventListener('click', closeShop);
  shopOverlay.addEventListener('click', (e) => {
    if (e.target === shopOverlay) closeShop(); // clicou fora do painel
  });

  // ---------------- PAUSE ----------------
  function setPaused(v){
    state.paused = v;
    pauseOverlay.classList.toggle('show', v);
    pauseBtn.textContent = v ? '▶' : '⏸';
  }

  pauseBtn.addEventListener('click', () => setPaused(!state.paused));
  resumeBtn.addEventListener('click', () => setPaused(false));

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key.toLowerCase() === 'p'){
      e.preventDefault();
      if (state.shiftRunning && !state.shopOpen) setPaused(!state.paused);
    }
  });

  // ---------------- DIA / EXPEDIENTE ----------------
  function endShift(){
    state.shiftRunning = false;
    tables.forEach(t => { t.occupied = false; t.orderId = null; t.el.classList.remove('show','match-highlight'); });
    state.carrying = null;
    updateCarryingUI();
    enddaySummary.textContent = `Você atendeu clientes durante o Dia ${state.day}.`;
    enddayCoins.textContent = state.coinsToday;
    enddayOverlay.classList.add('show');
  }

  nextdayBtn.addEventListener('click', () => {
    state.day += 1;
    state.coinsToday = 0;
    state.shiftTimeLeft = state.shiftDuration;
    state.shiftRunning = true;
    enddayOverlay.classList.remove('show');
    updateShiftUI();
  });

  // ---------------- LOOP PRINCIPAL ----------------
  let lastTime = performance.now();

  function tick(dt){
    state.shiftTimeLeft -= dt;
    if (state.shiftTimeLeft <= 0){
      state.shiftTimeLeft = 0;
      updateShiftUI();
      endShift();
      return;
    }
    updateShiftUI();

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval){
      state.spawnTimer = 0;
      trySpawnCustomer();
    }

    tables.forEach(t => {
      if (t.occupied){
        t.patience -= dt;
        if (t.patience <= 0) customerLeaves(t);
      }
    });
  }

  function loop(now){
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;

    if (!state.paused && !state.shopOpen && state.shiftRunning){
      try{
        tick(dt);
      } catch(err){
        DebugPanel.log(`<strong>Erro no loop:</strong> ${err.message}`);
      }
    }

    requestAnimationFrame(loop);
  }

  // ---------------- INIT ----------------
  renderRecipeTray();
  updateCarryingUI();
  updateCoinsUI();
  updateShiftUI();
  requestAnimationFrame(loop);

  } catch(err){
    DebugPanel.log(`<strong>Erro de inicialização:</strong> ${err.message}`);
  }
})();
</script>

</body>
