<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izakaya no Entardecer</title>
<style>
  :root{
    --ink-dark:#140f1c;
    --ink:#241a30;
    --ink-light:#3a2a4a;
    --plum:#5c2a45;
    --gold:#d3b678;
    --gold-dark:#8a6f3a;
    --rose:#e3a9c0;
    --paper:#efe6f0;
    --jade:#6fae5c;
    --shadow:rgba(10,4,14,.65);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:linear-gradient(160deg, #241a30, #0f0a16);
    font-family:'Segoe UI', 'Hiragino Sans', sans-serif;
    overflow:hidden;
    user-select:none;
  }

  .serif-title{
    font-family:'Times New Roman', 'Yu Mincho', serif;
    letter-spacing:1px;
  }
  .serif-title::before, .serif-title::after{
    content:"✦";
    color:var(--rose);
    font-size:.65em;
    margin:0 10px;
    vertical-align:middle;
    opacity:.85;
  }

  #game{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      url('background.png') center center / cover no-repeat,
      linear-gradient(160deg, #241a30, #0f0a16);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }

  #game::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(20,10,25,0) 52%, rgba(10,4,14,.68) 100%);
  }

  /* ---------- TELA DE CARREGAMENTO ---------- */
  #tela-loading{
    position:fixed;
    inset:0;
    background:linear-gradient(160deg, #241a30, #0f0a16);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:var(--paper);
    z-index:9998;
    transition:opacity .4s ease;
    /* rede de segurança independente de JS: some sozinha depois de 4s mesmo que o script falhe */
    animation:forcar-sumico 0s 4s forwards;
  }
  @keyframes forcar-sumico{
    to{ opacity:0; visibility:hidden; pointer-events:none; }
  }
  #tela-loading h1{
    font-family:'Times New Roman', 'Yu Mincho', serif;
    color:var(--gold);
    margin-bottom:10px;
    font-size:26px;
    letter-spacing:1px;
  }
  #barra-container{
    width:260px;
    height:12px;
    background:rgba(0,0,0,.5);
    border-radius:999px;
    overflow:hidden;
    margin-top:18px;
    border:1px solid var(--gold-dark);
  }
  #barra-progresso{
    width:0%;
    height:100%;
    background:linear-gradient(90deg, var(--rose), var(--gold));
    transition:width .15s ease;
  }
  #texto-carregando{
    margin-top:10px;
    font-size:13px;
    color:var(--paper);
    opacity:.8;
  }

  /* ---------- HUD SUPERIOR ---------- */
  #hud-top{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:16px 20px;
    z-index:20;
    pointer-events:none;
  }

  .hud-left, .hud-right{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }

  .hud-pill{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(180deg, var(--ink-light), var(--ink));
    border:1.5px solid var(--gold-dark);
    border-radius:999px;
    padding:8px 16px;
    color:var(--paper);
    font-weight:700;
    font-size:18px;
    box-shadow:0 4px 10px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .coin-icon{
    width:24px;height:24px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6e0, var(--gold) 55%, var(--gold-dark) 100%);
    border:2px solid var(--gold-dark);
    display:inline-block;
    box-shadow:0 0 6px rgba(211,182,120,.7);
  }

  .icon-btn{
    pointer-events:auto;
    background:linear-gradient(180deg, var(--ink-light), var(--ink));
    border:1.5px solid var(--gold-dark);
    color:var(--paper);
    width:46px;height:46px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 4px 10px var(--shadow);
    transition:transform .1s;
  }
  .icon-btn:active{ transform:scale(.92); }

  /* ---------- BARRA DE EXPEDIENTE ---------- */
  #shift-bar-wrap{
    position:absolute;
    top:64px;
    left:50%;
    transform:translateX(-50%);
    width:min(480px, 70vw);
    z-index:20;
    text-align:center;
    pointer-events:none;
  }

  #shift-label{
    color:var(--paper);
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
    text-shadow:0 2px 4px #000;
    margin-bottom:4px;
  }

  #shift-track{
    height:14px;
    border-radius:999px;
    background:rgba(0,0,0,.5);
    border:1px solid var(--gold-dark);
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }

  #shift-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg, var(--rose), var(--gold) 60%, var(--gold-dark));
    transition:width .2s linear;
  }

  /* ---------- MESAS / CLIENTES ---------- */
  #tables-layer{
    position:absolute;
    inset:0;
    z-index:10;
  }

  .table-spot{
    position:absolute;
    width:9%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    cursor:pointer;
  }

  .table-spot.t1{ left:28%; top:53%; }
  .table-spot.t2{ left:50%; top:51%; }
  .table-spot.t3{ left:73%; top:53%; }

  .customer{
    width:100%;
    height:100%;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose) 55%, var(--plum) 100%);
    border:3px solid #f2e6d8;
    box-shadow:0 0 18px rgba(227,169,192,.75), 0 6px 12px var(--shadow);
    animation:pop .25s ease-out;
    overflow:visible;
    transition:box-shadow .2s;
  }
  .customer.show{ display:flex; }

  .customer.match-highlight{
    box-shadow:0 0 0 6px rgba(111,174,92,.55), 0 0 18px rgba(227,169,192,.75), 0 6px 12px var(--shadow);
  }

  .customer-sprite{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:top center;
    pointer-events:none;
  }

  .customer-fallback-emoji{
    display:none;
    font-size:2em;
    pointer-events:none;
  }
  .customer.sprite-failed .customer-sprite{ display:none; }
  .customer.sprite-failed .customer-fallback-emoji{ display:block; }

  .order-bubble{
    position:absolute;
    top:-14px;
    right:-10px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--gold-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1em;
    box-shadow:0 3px 6px var(--shadow);
    pointer-events:none;
  }

  @keyframes pop{
    from{ transform:scale(.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  /* anel de paciência real: esvazia devagar conforme --pct diminui via JS */
  .patience-ring{
    position:absolute;
    inset:-7px;
    border-radius:50%;
    background:conic-gradient(var(--rose) var(--pct, 100%), rgba(255,255,255,.12) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    pointer-events:none;
  }

  .coin-pop{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold);
    font-weight:800;
    font-size:16px;
    text-shadow:0 2px 4px #000;
    pointer-events:none;
    animation:rise .8s ease-out forwards;
  }
  .coin-pop.miss{ color:#d8cfe0; }
  @keyframes rise{
    to{ transform:translate(-50%,-40px); opacity:0; }
  }

  /* ---------- DESPENSA (estoque de pratos prontos) ---------- */
  #kitchen-bar{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:25;
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(180deg, var(--ink-light), var(--ink-dark));
    border:1.5px solid var(--gold-dark);
    border-radius:18px;
    padding:10px 14px;
    box-shadow:0 6px 18px var(--shadow);
  }

  #carrying-slot{
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px dashed var(--gold-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6em;
    background:rgba(0,0,0,.3);
    flex-shrink:0;
    color:var(--paper);
  }
  #carrying-slot.filled{
    border-style:solid;
    background:radial-gradient(circle at 35% 30%, #fff6e0, var(--gold) 60%, var(--gold-dark));
    animation:pop .2s ease-out;
  }

  #trash-btn{
    width:44px;
    height:44px;
    border-radius:12px;
    border:2px solid var(--gold-dark);
    background:linear-gradient(180deg, var(--ink-light), var(--ink-dark));
    color:var(--paper);
    font-size:1.2em;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 3px 8px var(--shadow);
  }
  #trash-btn:disabled{ opacity:.35; cursor:not-allowed; filter:grayscale(.5); }
  #trash-btn:not(:disabled):active{ transform:scale(.9); }

  #kitchen-divider{
    width:2px;
    align-self:stretch;
    background:rgba(255,255,255,.12);
    margin:2px 0;
  }

  #recipe-tray{
    display:flex;
    gap:8px;
  }

  .recipe-btn{
    position:relative;
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px solid var(--gold-dark);
    background:linear-gradient(180deg, #f0dfa0, var(--gold));
    font-size:1.5em;
    cursor:pointer;
    box-shadow:0 3px 8px var(--shadow);
  }
  .recipe-btn:active{ transform:scale(.94); }
  .recipe-btn:disabled{ cursor:not-allowed; opacity:.45; filter:grayscale(.4); }

  .stock-badge{
    position:absolute;
    bottom:-6px;
    right:-6px;
    min-width:18px;
    height:18px;
    padding:0 4px;
    border-radius:999px;
    background:var(--ink-dark);
    border:1.5px solid var(--gold-dark);
    color:var(--paper);
    font-size:10px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stock-badge.low{ background:var(--plum); border-color:var(--rose); color:#fff; }

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(6,3,10,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }

  .panel{
    background:linear-gradient(180deg, var(--ink-light), var(--ink-dark));
    border:1.5px solid var(--gold-dark);
    border-radius:16px;
    padding:32px 36px;
    text-align:center;
    color:var(--paper);
    min-width:280px;
    box-shadow:0 10px 30px var(--shadow), inset 0 0 40px rgba(92,42,69,.25);
  }

  .panel h2{
    margin:0 0 12px;
    color:var(--gold);
    font-size:23px;
  }

  .panel p{
    margin:6px 0;
    font-size:16px;
  }

  .panel .big-coin{
    font-size:22px;
    color:var(--gold);
    font-weight:800;
    margin:14px 0;
  }

  .game-btn{
    margin-top:16px;
    background:linear-gradient(180deg, var(--gold), var(--gold-dark));
    border:none;
    color:var(--ink-dark);
    font-weight:800;
    font-size:16px;
    padding:12px 28px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 10px var(--shadow);
  }
  .game-btn:active{ transform:translateY(1px); }

  /* ---------- LOJA ---------- */
  #shop-panel{
    position:relative;
    background:linear-gradient(180deg, var(--ink-light), var(--ink-dark));
    border:1.5px solid var(--gold-dark);
    border-radius:16px;
    padding:24px 26px;
    color:var(--paper);
    width:min(420px, 90vw);
    max-height:80vh;
    overflow-y:auto;
    box-shadow:0 10px 30px var(--shadow), inset 0 0 40px rgba(92,42,69,.25);
  }
  #shop-panel h2{
    margin:0 0 4px;
    color:var(--gold);
    text-align:center;
  }
  #shop-panel .shop-sub{
    text-align:center;
    font-size:13px;
    opacity:.8;
    margin-bottom:16px;
  }

  #shop-close-x{
    position:absolute;
    top:10px;
    right:10px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1.5px solid var(--gold-dark);
    background:rgba(0,0,0,.35);
    color:var(--paper);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #shop-close-x:active{ transform:scale(.92); }

  .shop-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(0,0,0,.28);
    border:1px solid var(--gold-dark);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .shop-item .shop-icon{
    width:42px;height:42px;
    border-radius:10px;
    background:linear-gradient(180deg, #f0dfa0, var(--gold));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4em;
    flex-shrink:0;
  }
  .shop-item .shop-info{
    flex:1;
    text-align:left;
  }
  .shop-item .shop-info .shop-name{
    font-weight:700;
    font-size:15px;
  }
  .shop-item .shop-info .shop-desc{
    font-size:12px;
    opacity:.75;
  }
  .shop-buy-btn{
    background:linear-gradient(180deg, var(--gold), var(--gold-dark));
    border:none;
    color:var(--ink-dark);
    font-weight:800;
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
  }
  .shop-buy-btn:disabled{
    background:#4a4453;
    color:#a79db3;
    cursor:not-allowed;
  }
  .shop-buy-btn.secondary{
    background:linear-gradient(180deg, var(--ink-light), var(--ink));
    color:var(--paper);
    border:1px solid var(--gold-dark);
  }

  #shop-close-btn{
    display:block;
    margin:14px auto 0;
  }

  #reset-save-link{
    text-align:center;
    margin-top:14px;
    font-size:11px;
    color:#a79db3;
    text-decoration:underline;
    cursor:pointer;
    opacity:.75;
  }
  #reset-save-link:hover{ opacity:1; color:var(--rose); }

  .toast{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,10,20,.9);
    border:1px solid var(--gold-dark);
    color:var(--paper);
    padding:8px 18px;
    border-radius:999px;
    font-size:14px;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  /* ---------- PAINEL DE DIAGNÓSTICO ---------- */
  #debug-panel{
    position:fixed;
    left:10px;
    bottom:10px;
    max-width:min(92vw, 480px);
    max-height:40vh;
    overflow:auto;
    background:rgba(20,4,4,.92);
    border:2px solid #ff6b6b;
    color:#ffe2e2;
    font:12px/1.5 monospace;
    padding:10px 12px;
    border-radius:8px;
    z-index:9999;
    display:none;
    white-space:pre-wrap;
  }
  #debug-panel.show{ display:block; }
  #debug-panel strong{ color:#ff9d9d; }
</style>
</head>
<body>

<!-- TELA DE CARREGAMENTO -->
<div id="tela-loading">
  <h1 class="serif-title">Izakaya no Entardecer</h1>
  <div id="barra-container"><div id="barra-progresso"></div></div>
  <p id="texto-carregando">Preparando o salão... 0%</p>
</div>

<!-- MÚSICA DE FUNDO EM LOOP (opcional — some silenciosamente se o arquivo não existir) -->
<audio id="bg-music" src="bg-music.mp3" loop preload="auto"></audio>

<div id="game">

  <!-- HUD -->
  <div id="hud-top">
    <div class="hud-left">
      <div class="hud-pill">
        <span class="coin-icon"></span>
        <span id="coin-count">0</span>
      </div>
      <button class="icon-btn" id="shop-btn" title="Loja">🏮</button>
      <button class="icon-btn" id="sound-btn" title="Som">🔊</button>
    </div>
    <button class="icon-btn" id="pause-btn" title="Pausar">⏸</button>
  </div>

  <div id="shift-bar-wrap">
    <div id="shift-label">DIA <span id="day-count">1</span> — EXPEDIENTE</div>
    <div id="shift-track"><div id="shift-fill"></div></div>
  </div>

  <!-- clientes sobre as mesas -->
  <div id="tables-layer">
    <div class="table-spot t1"><div class="customer" id="c1">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
    <div class="table-spot t2"><div class="customer" id="c2">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
    <div class="table-spot t3"><div class="customer" id="c3">
      <div class="patience-ring"></div>
      <img class="customer-sprite" alt="Cliente">
      <span class="customer-fallback-emoji">🐾</span>
      <div class="order-bubble"></div>
    </div></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- despensa: pegue um item do estoque e entregue na mesa certa -->
  <div id="kitchen-bar">
    <div id="carrying-slot" title="Prato na mão">—</div>
    <button id="trash-btn" title="Descartar prato errado" disabled>🗑️</button>
    <div id="kitchen-divider"></div>
    <div id="recipe-tray"></div>
  </div>

  <!-- overlay de pause -->
  <div class="overlay" id="pause-overlay">
    <div class="panel">
      <h2 class="serif-title">Jogo Pausado</h2>
      <p>Respire um pouco antes de voltar ao balcão.</p>
      <button class="game-btn" id="resume-btn">Continuar</button>
    </div>
  </div>

  <!-- overlay fim de expediente -->
  <div class="overlay" id="endday-overlay">
    <div class="panel">
      <h2 class="serif-title">Fim do Expediente</h2>
      <p id="endday-summary">Você atendeu os clientes do Dia 1.</p>
      <div class="big-coin">+<span id="endday-coins">0</span> moedas hoje</div>
      <button class="game-btn" id="nextday-btn">Começar Dia 2</button>
    </div>
  </div>

  <!-- overlay da loja -->
  <div class="overlay" id="shop-overlay">
    <div id="shop-panel">
      <button id="shop-close-x" title="Fechar">✕</button>
      <h2 class="serif-title">Lojinha do Izakaya</h2>
      <div class="shop-sub">Desbloqueie receitas e reponha o estoque</div>
      <div id="shop-list"></div>
      <button class="game-btn" id="shop-close-btn">Fechar</button>
      <div id="reset-save-link">Apagar progresso salvo</div>
    </div>
  </div>

</div>

<div id="debug-panel"></div>

<script>
/* =========================================================================
   PAINEL DE DIAGNÓSTICO
   Fica logo no início do script de propósito: qualquer erro nos blocos
   seguintes (mesmo na tela de carregamento) precisa ser capturado aqui,
   em vez de travar o resto do jogo em silêncio.
   ========================================================================= */
const DebugPanel = (function(){
  const panel = document.getElementById('debug-panel');
  const lines = [];
  function render(){
    panel.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
    panel.classList.add('show');
  }
  return { log(msg){ lines.push(msg); render(); } };
})();

window.addEventListener('error', function(e){
  DebugPanel.log(`<strong>Erro de JS:</strong> ${e.message} (linha ${e.lineno})`);
});

/* =========================================================================
   TELA DE CARREGAMENTO
   Progresso simulado só pelo clima; tem um teto de tempo real (~2s) e um
   timeout de segurança. Tudo dentro de try/catch: se algo aqui falhar,
   a tela de carregamento só some na hora em vez de travar o script inteiro
   (sem isso, um erro aqui impediria até a loja e os clientes de funcionar).
   ========================================================================= */
(function(){
  try{
    const barra = document.getElementById('barra-progresso');
    const texto = document.getElementById('texto-carregando');
    const telaLoading = document.getElementById('tela-loading');
    let progresso = 0;

    const intervalo = setInterval(() => {
      progresso = Math.min(100, progresso + Math.floor(Math.random() * 18) + 8);
      if (barra) barra.style.width = progresso + '%';
      if (texto) texto.textContent = `Preparando o salão... ${progresso}%`;
      if (progresso >= 100) esconder();
    }, 90);

    const timeoutSeguranca = setTimeout(esconder, 2000);

    function esconder(){
      clearInterval(intervalo);
      clearTimeout(timeoutSeguranca);
      if (!telaLoading) return;
      telaLoading.style.opacity = '0';
      setTimeout(() => { telaLoading.style.display = 'none'; }, 400);
    }
  } catch(err){
    DebugPanel.log(`<strong>Erro na tela de carregamento:</strong> ${err.message}`);
    const t = document.getElementById('tela-loading');
    if (t) t.style.display = 'none';
  }
})();

/* =========================================================================
   RECEITAS E LOJA
   - "unlocked": já disponível na despensa desde o início
   - "stock": quantidade pronta pra entregar agora (cai a cada item pego)
   - "restockPrice": custo do pacote de reposição (sempre +STOCK_PACK_SIZE)
   - "reward": intervalo de moedas ganho ao entregar corretamente
   ========================================================================= */
const STOCK_PACK_SIZE = 10;

const RECIPES = [
  { id:'sake',     name:'Sakê',     emoji:'🍶', price:0,   restockPrice:12, reward:[5,9],   unlocked:true,  stock:10 },
  { id:'ramen',    name:'Ramen',    emoji:'🍜', price:0,   restockPrice:18, reward:[8,13],  unlocked:true,  stock:10 },
  { id:'onigiri',  name:'Onigiri',  emoji:'🍙', price:30,  restockPrice:22, reward:[10,16], unlocked:false, stock:0  },
  { id:'sushi',    name:'Sushi',    emoji:'🍣', price:60,  restockPrice:35, reward:[14,22], unlocked:false, stock:0  },
  { id:'dango',    name:'Dango',    emoji:'🍡', price:90,  restockPrice:45, reward:[17,26], unlocked:false, stock:0  },
  { id:'yakitori', name:'Yakitori', emoji:'🍢', price:130, restockPrice:60, reward:[22,34], unlocked:false, stock:0  },
];

const UPGRADES = [
  { id:'patience1', name:'Sino da Paciência', emoji:'🔔', price:50,
    desc:'Clientes esperam mais tempo', unlocked:false,
    apply(state){ state.patienceTime += 4; } },
  { id:'spawn1', name:'Fama do Izakaya', emoji:'🎏', price:80,
    desc:'Clientes chegam com mais frequência', unlocked:false,
    apply(state){ state.spawnInterval = Math.max(0.7, state.spawnInterval - 0.5); } },
];

function recipeById(id){ return RECIPES.find(r => r.id === id); }

/* =========================================================================
   EFEITOS SONOROS
   Gerados por síntese (Web Audio API) em vez de arquivos de áudio — assim
   não depende de nenhum asset extra no repositório e funciona offline.
   ========================================================================= */
const SFX = (function(){
  let ctx = null;
  let enabled = true;

  function ensureCtx(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, vol, delay){
    if (!enabled) return;
    try{
      const c = ensureCtx();
      if (!c) return;
      const t0 = c.currentTime + (delay || 0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch(e){ /* som nunca deve travar o jogo */ }
  }

  return {
    setEnabled(v){ enabled = v; },
    isEnabled(){ return enabled; },
    pickup(){ tone(660, 0.09, 'triangle', 0.15); },
    success(){ tone(880, 0.09, 'sine', 0.2); tone(1320, 0.12, 'sine', 0.15, 0.06); },
    miss(){ tone(180, 0.25, 'sawtooth', 0.15); },
    trash(){ tone(300, 0.05, 'square', 0.1); tone(140, 0.12, 'square', 0.08, 0.05); },
    arrive(){ tone(720, 0.08, 'sine', 0.12); },
    leave(){ tone(400, 0.2, 'sine', 0.1); tone(280, 0.25, 'sine', 0.08, 0.08); },
    buy(){ tone(500, 0.06, 'triangle', 0.15); tone(750, 0.1, 'triangle', 0.15, 0.05); },
    click(){ tone(500, 0.04, 'square', 0.08); },
    dayEnd(){ tone(523, 0.15, 'sine', 0.15); tone(659, 0.15, 'sine', 0.15, 0.1); tone(784, 0.3, 'sine', 0.18, 0.2); },
  };
})();

/* =========================================================================
   SALVAMENTO DE PROGRESSO (localStorage)
   ========================================================================= */
const SAVE_KEY = 'izakaya_no_entardecer_save_v1';

function saveGame(state){
  try{
    const data = {
      coins: state.coins,
      day: state.day,
      patienceTime: state.patienceTime,
      spawnInterval: state.spawnInterval,
      soundEnabled: SFX.isEnabled(),
      recipes: RECIPES.map(r => ({ id:r.id, unlocked:r.unlocked, stock:r.stock })),
      upgrades: UPGRADES.map(u => ({ id:u.id, unlocked:u.unlocked })),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e){
    DebugPanel.log(`<strong>Aviso:</strong> não foi possível salvar o progresso (${e.message}).`);
  }
}

function loadGame(state){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);

    if (typeof data.coins === 'number') state.coins = data.coins;
    if (typeof data.day === 'number') state.day = data.day;
    if (typeof data.patienceTime === 'number') state.patienceTime = data.patienceTime;
    if (typeof data.spawnInterval === 'number') state.spawnInterval = data.spawnInterval;
    if (typeof data.soundEnabled === 'boolean') SFX.setEnabled(data.soundEnabled);

    if (Array.isArray(data.recipes)){
      data.recipes.forEach(saved => {
        const r = recipeById(saved.id);
        if (r){
          r.unlocked = !!saved.unlocked;
          if (typeof saved.stock === 'number') r.stock = saved.stock;
        }
      });
    }
    if (Array.isArray(data.upgrades)){
      data.upgrades.forEach(saved => {
        const u = UPGRADES.find(x => x.id === saved.id);
        if (u) u.unlocked = !!saved.unlocked;
      });
    }
    return true;
  } catch(e){
    DebugPanel.log(`<strong>Aviso:</strong> não foi possível carregar o progresso salvo (${e.message}).`);
    return false;
  }
}

function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); } catch(e){ /* ignora */ }
}

/* =========================================================================
   JOGO
   ========================================================================= */
(function(){
  try{

  // ---------------- ESTADO ----------------
  const state = {
    coins: 0,
    day: 1,
    shiftDuration: 60,
    shiftTimeLeft: 60,
    paused: false,
    shopOpen: false,
    shiftRunning: true,
    coinsToday: 0,
    spawnTimer: 0,
    spawnInterval: 1.1,   // segundos entre tentativas de spawn (mais baixo = mais rápido)
    patienceTime: 10,   // paciência base, em segundos (mais alta = cai mais devagar)
    carrying: null,     // id da receita que o jogador está segurando pronta
  };

  const tables = ['c1','c2','c3'].map(id => {
    const el = document.getElementById(id);
    return {
      el,
      ring: el.querySelector('.patience-ring'),
      img: el.querySelector('.customer-sprite'),
      bubble: el.querySelector('.order-bubble'),
      occupied: false,
      patience: 0,
      orderId: null,
    };
  });

  const coinCountEl = document.getElementById('coin-count');
  const dayCountEl = document.getElementById('day-count');
  const shiftFillEl = document.getElementById('shift-fill');
  const pauseBtn = document.getElementById('pause-btn');
  const pauseOverlay = document.getElementById('pause-overlay');
  const resumeBtn = document.getElementById('resume-btn');
  const enddayOverlay = document.getElementById('endday-overlay');
  const enddaySummary = document.getElementById('endday-summary');
  const enddayCoins = document.getElementById('endday-coins');
  const nextdayBtn = document.getElementById('nextday-btn');
  const toastEl = document.getElementById('toast');
  const carryingSlot = document.getElementById('carrying-slot');
  const trashBtn = document.getElementById('trash-btn');
  const recipeTray = document.getElementById('recipe-tray');
  const shopBtn = document.getElementById('shop-btn');
  const shopOverlay = document.getElementById('shop-overlay');
  const shopList = document.getElementById('shop-list');
  const shopCloseBtn = document.getElementById('shop-close-btn');
  const soundBtn = document.getElementById('sound-btn');
  const resetSaveLink = document.getElementById('reset-save-link');

  // ---------------- UI HELPERS ----------------
  function updateCoinsUI(){
    coinCountEl.textContent = state.coins;
  }

  function updateShiftUI(){
    const pct = Math.max(0, (state.shiftTimeLeft / state.shiftDuration) * 100);
    shiftFillEl.style.width = pct + '%';
    dayCountEl.textContent = state.day;
  }

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1300);
  }

  function spawnCoinPop(tableEl, amount, isMiss){
    const pop = document.createElement('div');
    pop.className = 'coin-pop' + (isMiss ? ' miss' : '');
    pop.textContent = '+' + amount;
    tableEl.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }

  function refreshTableHighlights(){
    tables.forEach(t => {
      const isMatch = state.carrying && t.occupied && t.orderId === state.carrying;
      t.el.classList.toggle('match-highlight', !!isMatch);
    });
  }

  // ---------------- DESPENSA (pegar do estoque) ----------------
  function unlockedRecipes(){ return RECIPES.filter(r => r.unlocked); }

  function renderRecipeTray(){
    recipeTray.innerHTML = '';
    unlockedRecipes().forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'recipe-btn';
      btn.title = r.name;
      btn.dataset.recipeId = r.id;
      btn.innerHTML = `${r.emoji}<span class="stock-badge">${r.stock}</span>`;
      btn.addEventListener('click', () => pickFromStock(r.id));
      recipeTray.appendChild(btn);
    });
    refreshTrayStock();
  }

  function refreshTrayStock(){
    [...recipeTray.children].forEach(btn => {
      const r = recipeById(btn.dataset.recipeId);
      if (!r) return;
      const badge = btn.querySelector('.stock-badge');
      badge.textContent = r.stock;
      badge.classList.toggle('low', r.stock <= 2 && r.stock > 0);
      btn.disabled = r.stock <= 0;
    });
  }

  function updateCarryingUI(){
    if (state.carrying){
      const r = recipeById(state.carrying);
      carryingSlot.textContent = r ? r.emoji : '?';
      carryingSlot.classList.add('filled');
    } else {
      carryingSlot.textContent = '—';
      carryingSlot.classList.remove('filled');
    }
    trashBtn.disabled = !state.carrying;
    refreshTableHighlights();
  }

  function discardCarrying(){
    if (!state.carrying) return;
    state.carrying = null;
    updateCarryingUI();
    SFX.trash();
    showToast('Prato descartado na lixeira.');
    saveGame(state);
  }
  trashBtn.addEventListener('click', discardCarrying);

  function pickFromStock(recipeId){
    if (state.carrying){
      showToast('Entregue o prato que já está na mão antes de pegar outro.');
      return;
    }
    const recipe = recipeById(recipeId);
    if (!recipe || recipe.stock <= 0){
      showToast('Estoque zerado! Reponha na lojinha 🏮.');
      return;
    }
    recipe.stock -= 1;
    state.carrying = recipe.id;
    refreshTrayStock();
    updateCarryingUI();
    SFX.pickup();
    saveGame(state);
  }

  // ---------------- CLIENTES ----------------
  function trySpawnCustomer(){
    const free = tables.filter(t => !t.occupied);
    if (free.length === 0) return;
    if (Math.random() > 0.85) return; // quase sempre spawna quando há chance

    const pool = unlockedRecipes();
    if (pool.length === 0) return;

    const t = free[Math.floor(Math.random() * free.length)];
    const recipe = pool[Math.floor(Math.random() * pool.length)];

    t.occupied = true;
    t.patience = state.patienceTime;
    t.orderId = recipe.id;
    t.bubble.textContent = recipe.emoji;
    t.ring.style.setProperty('--pct', '100%');

    const sprite = ASSETS.customerSprites[Math.floor(Math.random() * ASSETS.customerSprites.length)];
    t.img.src = sprite;
    t.el.classList.remove('sprite-failed');
    t.el.classList.add('show');

    refreshTableHighlights();
    SFX.arrive();
  }

  function deliverTo(t){
    if (!t.occupied){
      if (state.carrying) showToast('Não tem ninguém nessa mesa.');
      return;
    }
    if (!state.carrying){
      showToast('Pegue um prato na despensa antes de atender!');
      return;
    }

    const correct = t.orderId === state.carrying;
    const recipe = recipeById(t.orderId);
    let reward;
    if (correct){
      const [min, max] = recipe.reward;
      reward = min + Math.floor(Math.random() * (max - min + 1));
      SFX.success();
    } else {
      reward = 1 + Math.floor(Math.random() * 2);
      showToast('Isso não era o que esse cliente pediu... ele aceitou por educação.');
      SFX.miss();
    }

    state.coins += reward;
    state.coinsToday += reward;
    updateCoinsUI();
    spawnCoinPop(t.el, reward, !correct);

    t.occupied = false;
    t.orderId = null;
    t.el.classList.remove('show', 'match-highlight');

    state.carrying = null;
    updateCarryingUI();
    saveGame(state);
  }

  function customerLeaves(t){
    t.occupied = false;
    t.orderId = null;
    t.el.classList.remove('show', 'match-highlight');
    showToast('Um cliente foi embora sem ser atendido...');
    SFX.leave();
  }

  tables.forEach(t => {
    t.el.addEventListener('click', () => deliverTo(t));
    t.img.addEventListener('error', () => t.el.classList.add('sprite-failed'));
  });

  // ---------------- LOJA ----------------
  function renderShop(){
    shopList.innerHTML = '';

    RECIPES.filter(r => r.price > 0 || r.unlocked).forEach(r => {
      const row = document.createElement('div');
      row.className = 'shop-item';

      if (!r.unlocked){
        row.innerHTML = `
          <div class="shop-icon">${r.emoji}</div>
          <div class="shop-info">
            <div class="shop-name">${r.name}</div>
            <div class="shop-desc">Nova receita — vem com ${STOCK_PACK_SIZE} no estoque</div>
          </div>
          <button class="shop-buy-btn">${r.price} 🪙</button>
        `;
        const buyBtn = row.querySelector('.shop-buy-btn');
        buyBtn.disabled = state.coins < r.price;
        buyBtn.addEventListener('click', () => {
          if (r.unlocked || state.coins < r.price) return;
          state.coins -= r.price;
          r.unlocked = true;
          r.stock = STOCK_PACK_SIZE;
          updateCoinsUI();
          renderRecipeTray();
          renderShop();
          showToast(`${r.name} adicionado ao cardápio!`);
          SFX.buy();
          saveGame(state);
        });
      } else {
        row.innerHTML = `
          <div class="shop-icon">${r.emoji}</div>
          <div class="shop-info">
            <div class="shop-name">${r.name}</div>
            <div class="shop-desc">Estoque atual: <span class="stock-count">${r.stock}</span></div>
          </div>
          <button class="shop-buy-btn secondary">+${STOCK_PACK_SIZE} por ${r.restockPrice} 🪙</button>
        `;
        const buyBtn = row.querySelector('.shop-buy-btn');
        buyBtn.disabled = state.coins < r.restockPrice;
        buyBtn.addEventListener('click', () => {
          if (state.coins < r.restockPrice) return;
          state.coins -= r.restockPrice;
          r.stock += STOCK_PACK_SIZE;
          updateCoinsUI();
          refreshTrayStock();
          renderShop();
          showToast(`+${STOCK_PACK_SIZE} de ${r.name} no estoque!`);
          SFX.buy();
          saveGame(state);
        });
      }

      shopList.appendChild(row);
    });

    UPGRADES.forEach(u => {
      const row = document.createElement('div');
      row.className = 'shop-item';
      row.innerHTML = `
        <div class="shop-icon">${u.emoji}</div>
        <div class="shop-info">
          <div class="shop-name">${u.name}</div>
          <div class="shop-desc">${u.desc}</div>
        </div>
        <button class="shop-buy-btn">${u.unlocked ? 'Comprado ✓' : u.price + ' 🪙'}</button>
      `;
      const buyBtn = row.querySelector('.shop-buy-btn');
      buyBtn.disabled = u.unlocked || state.coins < u.price;
      buyBtn.addEventListener('click', () => {
        if (u.unlocked || state.coins < u.price) return;
        state.coins -= u.price;
        u.unlocked = true;
        u.apply(state);
        updateCoinsUI();
        renderShop();
        showToast(`${u.name} aplicado!`);
        SFX.buy();
        saveGame(state);
      });
      shopList.appendChild(row);
    });
  }

  function openShop(){
    state.shopOpen = true;
    renderShop();
    shopOverlay.classList.add('show');
  }
  function closeShop(){
    state.shopOpen = false;
    shopOverlay.classList.remove('show');
  }

  shopBtn.addEventListener('click', () => { SFX.click(); openShop(); });
  shopCloseBtn.addEventListener('click', () => { SFX.click(); closeShop(); });
  document.getElementById('shop-close-x').addEventListener('click', () => { SFX.click(); closeShop(); });
  shopOverlay.addEventListener('click', (e) => {
    if (e.target === shopOverlay) closeShop();
  });

  soundBtn.addEventListener('click', () => {
    SFX.setEnabled(!SFX.isEnabled());
    soundBtn.textContent = SFX.isEnabled() ? '🔊' : '🔇';
    if (SFX.isEnabled()){
      SFX.click();
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.pause();
    }
    saveGame(state);
  });

  resetSaveLink.addEventListener('click', () => {
    if (confirm('Isso vai apagar todo o progresso salvo (moedas, dia, receitas, estoque). Tem certeza?')){
      clearSave();
      location.reload();
    }
  });

  // ---------------- PAUSE ----------------
  function setPaused(v){
    state.paused = v;
    pauseOverlay.classList.toggle('show', v);
    pauseBtn.textContent = v ? '▶' : '⏸';
  }

  pauseBtn.addEventListener('click', () => { SFX.click(); setPaused(!state.paused); });
  resumeBtn.addEventListener('click', () => { SFX.click(); setPaused(false); });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key.toLowerCase() === 'p'){
      e.preventDefault();
      if (state.shiftRunning && !state.shopOpen) setPaused(!state.paused);
    }
  });

  // ---------------- DIA / EXPEDIENTE ----------------
  function endShift(){
    state.shiftRunning = false;
    tables.forEach(t => { t.occupied = false; t.orderId = null; t.el.classList.remove('show','match-highlight'); });
    state.carrying = null;
    updateCarryingUI();
    enddaySummary.textContent = `Você atendeu clientes durante o Dia ${state.day}.`;
    enddayCoins.textContent = state.coinsToday;
    enddayOverlay.classList.add('show');
    SFX.dayEnd();
    saveGame(state);
  }

  nextdayBtn.addEventListener('click', () => {
    state.day += 1;
    state.coinsToday = 0;
    state.shiftTimeLeft = state.shiftDuration;
    state.shiftRunning = true;
    enddayOverlay.classList.remove('show');
    updateShiftUI();
    saveGame(state);
    trySpawnCustomer();
    setTimeout(trySpawnCustomer, 500);
  });

  // ---------------- LOOP PRINCIPAL ----------------
  let lastTime = performance.now();

  function tick(dt){
    state.shiftTimeLeft -= dt;
    if (state.shiftTimeLeft <= 0){
      state.shiftTimeLeft = 0;
      updateShiftUI();
      endShift();
      return;
    }
    updateShiftUI();

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval){
      state.spawnTimer = 0;
      trySpawnCustomer();
    }

    tables.forEach(t => {
      if (t.occupied){
        t.patience -= dt;
        if (t.patience <= 0){
          customerLeaves(t);
        } else {
          const pct = Math.max(0, (t.patience / state.patienceTime) * 100);
          t.ring.style.setProperty('--pct', pct + '%');
        }
      }
    });
  }

  function loop(now){
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;

    if (!state.paused && !state.shopOpen && state.shiftRunning){
      try{
        tick(dt);
      } catch(err){
        DebugPanel.log(`<strong>Erro no loop:</strong> ${err.message}`);
      }
    }

    requestAnimationFrame(loop);
  }

  // ---------------- INIT ----------------
  const hadSave = loadGame(state);
  soundBtn.textContent = SFX.isEnabled() ? '🔊' : '🔇';
  renderRecipeTray();
  updateCarryingUI();
  updateCoinsUI();
  updateShiftUI();
  if (hadSave) showToast(`Bem-vinda de volta! Continuando no Dia ${state.day}.`);
  requestAnimationFrame(loop);

  // já chega gente logo de cara, em vez de deixar o salão vazio esperando o primeiro intervalo
  trySpawnCustomer();
  setTimeout(trySpawnCustomer, 500);

  // tenta tocar a música de fundo; navegadores bloqueiam autoplay com som,
  // então se falhar, começa a tocar no primeiro clique do jogador
  if (SFX.isEnabled()){
    bgMusic.play().catch(() => {
      document.addEventListener('click', () => {
        if (SFX.isEnabled()) bgMusic.play().catch(() => {});
      }, { once:true });
    });
  }

  // autosave: rede de segurança periódica + ao sair/minimizar a página
  setInterval(() => saveGame(state), 5000);
  window.addEventListener('beforeunload', () => saveGame(state));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGame(state);
  });

  } catch(err){
    DebugPanel.log(`<strong>Erro de inicialização:</strong> ${err.message}`);
  }
})();
</script>
